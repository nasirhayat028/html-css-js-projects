<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="weather-app">
            <h1>Weather App</h1>
            <div class="search-box">
                <input type="text" placeholder="Enter city name" id="city-input">
                <button id="search-btn">Search</button>
            </div>
            
            <div class="weather-info">
                <div class="weather-icon">
                    <img src="" alt="Weather Icon" id="weather-icon">
                </div>
                <div class="temperature">
                    <span id="temp-value">--</span>
                    <span id="temp-unit">°C</span>
                </div>
                <div class="description" id="weather-desc">--</div>
                
                <div class="details">
                    <div class="detail-item">
                        <span class="detail-label">Humidity</span>
                        <span class="detail-value" id="humidity">--%</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Wind</span>
                        <span class="detail-value" id="wind">-- km/h</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Feels Like</span>
                        <span class="detail-value" id="feels-like">--°C</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
